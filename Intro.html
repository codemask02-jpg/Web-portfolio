
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALFREDO M. HORTEZA | Portfolio</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #070b12;
            color: #ffffff;
            overflow: hidden;
        }


        /* =========================
           BACKGROUND
        ========================= */

        .intro {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(59, 130, 246, 0.16),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(14, 165, 233, 0.10),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #05070b 0%,
                    #0b111c 50%,
                    #05070c 100%
                );
        }


        /* =========================
           GRID BACKGROUND
        ========================= */

        .grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            mask-image: linear-gradient(
                to bottom,
                black,
                transparent 90%
            );

            pointer-events: none;
        }


        /* =========================
           GLOW EFFECTS
        ========================= */

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
        }

        .glow.one {
            width: 350px;
            height: 350px;

            background: #2563eb;

            opacity: 0.13;

            top: -150px;
            left: -120px;
        }

        .glow.two {
            width: 400px;
            height: 400px;

            background: #0ea5e9;

            opacity: 0.09;

            right: -180px;
            bottom: -180px;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .nav {
            position: absolute;

            top: 30px;
            left: 50%;

            transform: translateX(-50%);

            width: min(90%, 1100px);

            display: flex;
            align-items: center;
            justify-content: space-between;

            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-family: "Space Grotesk", sans-serif;

            font-size: 14px;
            font-weight: 700;

            letter-spacing: 2px;
        }

        .logo-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #3b82f6;

            box-shadow:
                0 0 15px rgba(59,130,246,.8);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;

            padding: 8px 14px;

            border: 1px solid rgba(255,255,255,.08);

            border-radius: 50px;

            background: rgba(255,255,255,.025);

            color: #8993a4;

            font-size: 11px;
            letter-spacing: .5px;
        }

        .status span {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 10px rgba(34,197,94,.8);
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .content {
            position: relative;
            z-index: 3;

            width: min(90%, 900px);

            text-align: center;

            animation: fadeUp 1s ease forwards;
        }


        /* =========================
           EYEBROW
        ========================= */

        .eyebrow {
            display: inline-flex;

            align-items: center;
            gap: 9px;

            padding: 8px 14px;

            border: 1px solid rgba(59,130,246,.2);

            border-radius: 50px;

            background: rgba(59,130,246,.06);

            color: #7db0ff;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 1.5px;
            text-transform: uppercase;

            margin-bottom: 25px;

            animation: fadeUp .9s ease .1s both;
        }

        .eyebrow::before {
            content: "";

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #60a5fa;

            box-shadow:
                0 0 10px #3b82f6;
        }


        /* =========================
           TITLE
        ========================= */

        h1 {
            font-family: "Space Grotesk", sans-serif;

            font-size: clamp(
                4rem,
                10vw,
                8.5rem
            );

            line-height: .86;

            letter-spacing: -7px;

            font-weight: 700;

            text-transform: uppercase;

            margin-bottom: 25px;

            color: #f8fafc;

            animation: fadeUp .9s ease .2s both;
        }

        h1 span {
            display: block;

            color: transparent;

            background:
                linear-gradient(
                    90deg,
                    #60a5fa,
                    #38bdf8,
                    #818cf8
                );

            -webkit-background-clip: text;
            background-clip: text;

            text-shadow:
                0 0 50px rgba(59,130,246,.12);
        }


        /* =========================
           NAME
        ========================= */

        .name {
            font-size: clamp(
                1rem,
                2vw,
                1.25rem
            );

            font-weight: 600;

            letter-spacing: 2px;

            color: #e2e8f0;

            animation:
                fadeUp .9s ease .35s both;
        }


        /* =========================
           COURSE
        ========================= */

        .course {
            margin-top: 10px;

            color: #64748b;

            font-size: .85rem;

            animation:
                fadeUp .9s ease .45s both;
        }


        /* =========================
           BUTTON
        ========================= */

        .enter {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            margin-top: 35px;

            padding: 15px 24px;

            border: 1px solid rgba(255,255,255,.1);

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );

            color: white;

            text-decoration: none;

            font-size: .78rem;

            font-weight: 700;

            letter-spacing: .8px;

            box-shadow:
                0 15px 40px rgba(37,99,235,.18);

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                border-color .25s ease;

            animation:
                fadeUp .9s ease .55s both;
        }

        .enter:hover {
            transform:
                translateY(-4px);

            box-shadow:
                0 20px 50px rgba(37,99,235,.3);

            border-color:
                rgba(96,165,250,.4);
        }

        .arrow {
            font-size: 16px;

            transition:
                transform .25s ease;
        }

        .enter:hover .arrow {
            transform:
                translateX(5px);
        }


        /* =========================
           SKILLS
        ========================= */

        .skills {
            display: flex;

            justify-content: center;
            align-items: center;

            flex-wrap: wrap;

            gap: 9px;

            margin-top: 30px;

            color: #64748b;

            font-size: .66rem;

            font-weight: 600;

            letter-spacing: 1.5px;

            animation:
                fadeUp .9s ease .65s both;
        }

        .skill {
            padding: 7px 11px;

            border: 1px solid rgba(255,255,255,.06);

            border-radius: 6px;

            background:
                rgba(255,255,255,.025);

            transition: .25s ease;
        }

        .skill:hover {
            color: #93c5fd;

            border-color:
                rgba(59,130,246,.25);

            background:
                rgba(59,130,246,.06);

            transform:
                translateY(-2px);
        }


        /* =========================
           BOTTOM INFO
        ========================= */

        .bottom {
            position: absolute;

            bottom: 25px;

            left: 0;
            right: 0;

            display: flex;

            justify-content: center;

            color: #3f4a5a;

            font-size: .62rem;

            letter-spacing: 1.5px;

            z-index: 5;
        }


        /* =========================
           PROGRESS
        ========================= */

        .progress {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;

            height: 2px;

            background:
                rgba(255,255,255,.04);

            z-index: 10;
        }

        .progress span {
            display: block;

            height: 100%;

            width: 0;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #38bdf8
                );

            box-shadow:
                0 0 12px rgba(59,130,246,.7);

            animation:
                load 2.2s ease forwards;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform:
                    translateY(25px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }

        @keyframes load {

            from {
                width: 0;
            }

            to {
                width: 100%;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width: 600px) {

            .nav {
                top: 20px;
            }

            .status {
                font-size: 9px;
                padding: 7px 10px;
            }

            h1 {
                font-size: clamp(
                    3.7rem,
                    17vw,
                    6rem
                );

                letter-spacing: -4px;
            }

            .name {
                font-size: .9rem;
                letter-spacing: 1px;
            }

            .course {
                font-size: .75rem;
            }

            .enter {
                padding: 14px 20px;
            }

            .skills {
                max-width: 330px;
                margin-left: auto;
                margin-right: auto;
            }

            .bottom {
                font-size: .55rem;
            }

        }

    </style>
</head>


<body>

<section class="intro">

    <!-- Background -->
    <div class="grid"></div>

    <div class="glow one"></div>
    <div class="glow two"></div>


    <!-- Navigation -->
    <nav class="nav">

        <div class="logo">
            <div class="logo-dot"></div>
            AMH
        </div>

        <div class="status">
            <span></span>
            AVAILABLE FOR PROJECTS
        </div>

    </nav>


    <!-- Main Content -->
    <main class="content">

        <div class="eyebrow">
            Welcome to my portfolio
        </div>


        <h1>
            PORTFOLIO
            
        </h1>


        <div class="name">
            ALFREDO M. HORTEZA
        </div>


        <div class="course">
            BS Information Technology Student
        </div>


        <!-- Portfolio Button -->
        <a href="Alfred.html" class="enter">

            VIEW MY PORTFOLIO

            <span class="arrow">
                →
            </span>

        </a>


        <!-- Skills -->
        <div class="skills">

            <span class="skill">HTML</span>

            <span class="skill">CSS</span>

            <span class="skill">JAVASCRIPT</span>

            <span class="skill">C#</span>

            <span class="skill">JAVA</span>

            <span class="skill">UI/UX</span>

        </div>

    </main>


    <!-- Footer -->
    <div class="bottom">

        ALFREDO M. HORTEZA
        &nbsp; • &nbsp;
        BSIT
        &nbsp; • &nbsp;
        2026

    </div>


    <!-- Loading Line -->
    <div class="progress">
        <span></span>
    </div>

</section>


</body>
</html>
